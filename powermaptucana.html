<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Map · Carteira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0d0d14;--board:#12121a;--card:#1c1c26;--area:#161620;--line:#3a3a4c;--bd:#2e2e40;--tx:#fff;--tx2:#d8d8e8;--tx3:#b4b4c4;--mut:#8a8aa0;--acc:#8B7BFF;--fav:#4ADE80;--neu:#FACC15;--det:#F87171;--nm:#8A8AA0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Nunito Sans',system-ui,sans-serif}
button,select,input,textarea{font-family:inherit}
.bar{position:sticky;top:0;z-index:5;background:#0d0d14ee;border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;color:var(--tx3);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:800;cursor:pointer;min-height:40px}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);color:var(--tx2);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--acc);color:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dng{border-color:#7a2f2f;color:#fca5a5}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx3)}
.wrap{padding:20px 16px;overflow-x:auto}
.board{width:1440px;margin:0 auto;background:var(--board);padding:36px 40px;border-radius:16px;display:flex;flex-direction:column;gap:22px}
.head{display:grid;grid-template-columns:360px minmax(0,1fr) 440px;gap:22px}
.ttl{display:flex;flex-direction:column;gap:6px;justify-content:center}
.ttl h1{margin:0;font-size:58px;line-height:1;font-weight:800}
.ttl h1 span{color:var(--acc)}
.ttl .cli{font-size:22px;font-weight:800;color:var(--tx2)}
.ttl .sub{font-size:13px;color:var(--tx3);line-height:1.5}
.box{border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--tx2)}
.pos3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.posc{border-radius:10px;background:var(--card);border:1.5px solid;padding:10px;display:flex;flex-direction:column;gap:5px}
.posc b{font-size:12px;display:flex;gap:6px;align-items:center;letter-spacing:.04em}
.posc small{font-size:11px;color:var(--tx3);line-height:1.35}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.roles div{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx2)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:20px;padding:0 6px;border-radius:6px;border:1px solid;font-size:11px;font-weight:800;flex:none}
.org{display:flex;flex-direction:column;align-items:stretch}
.topw{display:flex;justify-content:center}
.topw .card{width:360px}
.vl{width:2px;background:var(--line);align-self:center;flex:none}
.cols{position:relative;display:grid;gap:20px}
.hbar{position:absolute;top:0;height:2px;background:var(--line)}
.col{display:flex;flex-direction:column;align-items:center;min-width:0}
.area{width:100%;background:var(--area);border:1.5px solid;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;color:inherit}
.area .an{font-size:15px;font-weight:800}
.area .ad{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--tx3)}
.card{width:100%;background:var(--card);border:1.5px solid;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;color:inherit}
.card:hover,.area:hover{filter:brightness(1.15)}
.card.nm{border-style:dashed;background:#16161e}
.av{width:48px;height:48px;border-radius:50%;background:#2a2a3a;color:#e8e8f2;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:none;overflow:hidden;position:relative;cursor:pointer}
.av img{width:100%;height:100%;display:block;border-radius:50%}
.av:hover{outline:2px solid var(--acc);outline-offset:2px}
.exporting .av:hover{outline:none}
.ttl.ed{cursor:pointer;border-radius:12px;padding:6px;margin:-6px}
.ttl.ed:hover{background:#1a1a24}
.exporting .ttl.ed:hover{background:none}
.tab.add{border-style:dashed;color:var(--mut)}
.ph{display:flex;gap:14px;align-items:center}
.ph .av{width:72px;height:72px;font-size:22px;cursor:default}
.ph .av:hover{outline:none}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.nmx{font-size:15px;font-weight:800}
.cg{font-size:12px;color:var(--tx3)}
.tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.04em}
.rel{font-size:11px;color:var(--mut)}
.li{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:#0A66C2;color:#fff;font-size:11px;font-weight:800;cursor:pointer;flex:none;font-family:Arial,sans-serif}
.li:hover{outline:2px solid #fff;outline-offset:1px}
.note{font-size:11px;color:var(--tx3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hide-notes .note{display:none}
.addp,.adda{background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:10px;min-height:36px}
.addp:hover,.adda:hover{color:#fff;border-color:var(--acc)}
.adda{width:220px;align-self:center;margin-top:16px}
.exporting .edit-only{display:none!important}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;border-top:1px solid var(--bd);padding-top:16px}
.sum h3{margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--tx2)}
.kp{display:flex;gap:16px;flex-wrap:wrap}
.kp div{display:flex;flex-direction:column;gap:2px;min-width:90px}
.kp b{font-size:24px;font-weight:800}
.kp small{font-size:11px;color:var(--tx3)}
.cov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cov div{background:var(--card);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx3)}
.cov strong{color:#fff;font-size:12px}
.foot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-top:1px solid var(--bd);padding-top:16px}
.foot b{font-size:12px;font-weight:800;letter-spacing:.04em}
.foot p{margin:4px 0 0;font-size:12px;line-height:1.45;color:var(--tx3)}
.log{max-width:1440px;margin:0 auto 40px;padding:0 16px}
.log h2{font-size:16px;margin:8px 0 10px;color:var(--tx2)}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{font-size:13px;color:var(--tx3);background:#15151e;border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.log li span{color:var(--mut);margin-right:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.md{background:#181822;border:1px solid var(--bd);border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.md h2{margin:0;font-size:18px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:12px;color:var(--tx3);font-weight:600}
.fg input,.fg select,.fg textarea{background:#0f0f16;border:1px solid var(--bd);color:#fff;border-radius:8px;padding:9px 10px;font-size:14px}
.fg textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mdacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:4px}
.mdacts div{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22223a;border:1px solid var(--acc);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:30}
.toast.on{display:block}
.hint{max-width:1440px;margin:12px auto 0;padding:0 16px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="bar">
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="acts">
    <label class="chk"><input type="checkbox" id="notesChk" checked=""> Mostrar notas</label>
    <button class="btn" id="cliBtn">Editar cliente</button>
    <button class="btn pri" id="pngBtn">Baixar PNG (HubSpot)</button>
    <button class="btn" id="copyBtn">Copiar imagem</button>
    <button class="btn" id="htmlBtn">Salvar HTML atualizado</button>
    <button class="btn" id="jsonBtn">Exportar JSON</button>
    <button class="btn" id="impBtn">Importar JSON</button>
    <input type="file" id="impFile" accept="application/json" hidden="">
    <input type="file" id="photoFile" accept="image/*" hidden="">
  </div>
</div>
<p class="hint">Clique em uma pessoa, área ou no nome do cliente para editar. Clique na bolinha para incluir a foto e no ícone "in" para abrir o LinkedIn. As alterações ficam salvas neste navegador; use "Salvar HTML atualizado" para gerar a nova versão do arquivo.</p>

<script>
const TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;
let KEY = 'powermap-default';
const PAPEIS = {
  PS:{l:'Power Sponsor',d:'quem assina',c:'#F472B6'},
  BDM:{l:'Business Decision Maker',d:'decide pelo negócio',c:'#60A5FA'},
  TDM:{l:'Technical Decision Maker',d:'decide pelo técnico',c:'#A78BFA'},
  ES:{l:'Executive Sponsor',d:'patrocina no executivo',c:'#34D399'},
  I:{l:'Influencer',d:'influencia, não decide',c:'#A5B4FC'},
  C:{l:'Coach',d:'aliado e confidente interno',c:'#FB923C'}
};
const POST = {
  fav:{l:'Favorável',c:'#4ADE80',d:'Apoia, defende e promove a nossa solução.'},
  neu:{l:'Neutra',c:'#FACC15',d:'Sem opinião formada ou não vê impacto direto.'},
  det:{l:'Detratora',c:'#F87171',d:'Resiste ou é contra; pode influenciar negativamente.'},
  nm:{l:'A mapear',c:'#8A8AA0',d:'Pessoa ou posição ainda não validada.'}
};
const REL = {forte:'Forte',media:'Média',fria:'Fria',sem:'Sem relação',nm:'A mapear'};

const embedded = JSON.parse(document.getElementById('pm-data').textContent);
KEY = 'powermap-' + (embedded.docId || 'default');
let state = embedded;
try {
  const ls = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (ls && ls.clients && ls.savedAt > embedded.savedAt) state = ls;
} catch (e) {}
let curId = state.clients[0].id;
try { const t = localStorage.getItem(KEY + '-tab'); if (t && state.clients.some(c => c.id === t)) curId = t; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cur = () => state.clients.find(c => c.id === curId);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const br = iso => { const [y,m,d] = String(iso).split('-'); return d ? `${d}/${m}/${y}` : iso; };
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const isNm = p => !p.name || /^\[.*\]$/.test(p.name.trim());
const initials = n => isNm({name:n}) ? '?' : n.split(/[\s/]+/).filter(Boolean).map(w => w[0]).slice(0,2).join('').toUpperCase();

function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); }
function persist(){ state.savedAt = new Date().toISOString(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Não foi possível salvar no navegador. Use "Salvar HTML atualizado".'); } }
function touch(c, msg){ c.updatedAt = today(); if (msg) { c.log = c.log || []; c.log.unshift({d: today(), t: msg}); } persist(); render(); }

function badge(p){ const r = PAPEIS[p] || PAPEIS.I; return `<span class="badge" style="border-color:${r.c};color:${r.c}">${esc(p)}</span>`; }
function pill(k){ const s = POST[k] || POST.nm; return `<span class="pill" style="color:${s.c}"><span class="dot" style="background:${s.c}"></span>${s.l.toUpperCase()}</span>`; }

function card(p){
  const s = POST[p.postura] || POST.nm;
  return `<button type="button" class="card ${p.postura === 'nm' ? 'nm' : ''}" data-pid="${esc(p.id)}" style="border-color:${s.c}">
    <span class="av" data-photo="${esc(p.id)}" title="Incluir ou trocar foto">${p.foto ? `<img src="${esc(p.foto)}" alt="">` : esc(initials(p.name))}</span>
    <span class="info">
      <span class="nmx">${esc(p.name || '[A mapear]')}</span>
      <span class="cg">${esc(p.cargo)}</span>
      <span class="tags">${badge(p.papel)}${pill(p.postura)}${p.linkedin ? `<span class="li" data-li="${esc(p.linkedin)}" title="Abrir LinkedIn" role="link">in</span>` : ''}</span>
      <span class="rel">Relação: ${esc(REL[p.relacao] || 'A mapear')}</span>
      ${p.nota ? `<span class="note">${esc(p.nota)}</span>` : ''}
    </span></button>`;
}

function areaCol(a){
  const r = PAPEIS[a.papel] || PAPEIS.I;
  return `<div class="col">
    <div class="vl" style="height:22px"></div>
    <button type="button" class="area" data-area="${esc(a.id)}" style="border-color:${r.c}">
      <span class="an">${esc(a.name)}</span>
      <span class="ad">${badge(a.papel)}${esc(a.desc)}</span>
    </button>
    ${a.people.map(p => `<div class="vl" style="height:12px"></div>${card(p)}`).join('')}
    <button type="button" class="addp edit-only" data-add="${esc(a.id)}">+ Adicionar pessoa</button>
  </div>`;
}

function allPeople(c){ return [c.top, ...c.areas.flatMap(a => a.people)]; }

function renderBoard(){
  const c = cur(), n = Math.max(c.areas.length, 1), gap = 20;
  const ppl = allPeople(c), mapped = ppl.filter(p => p.postura !== 'nm' && !isNm(p));
  const cnt = k => ppl.filter(p => p.postura === k).length;
  const strong = ppl.filter(p => p.relacao === 'forte').length;
  const cov = ['PS','BDM','TDM','ES'].map(k => {
    const who = ppl.filter(p => p.papel === k && !isNm(p));
    const best = who.find(p => p.postura === 'fav') || who.find(p => p.postura === 'neu') || who[0];
    return `<div><strong>${badge(k)} ${PAPEIS[k].l}</strong>${best ? `${esc(best.name)} · <span style="color:${POST[best.postura].c}">${POST[best.postura].l}</span>` : '<span style="color:#F87171">Lacuna: não mapeado</span>'}</div>`;
  }).join('');

  $('board').innerHTML = `
  <div class="head">
    <div class="ttl ed" data-client="1" title="Editar dados do cliente">
      <h1>POWER <span>MAP</span></h1>
      <div class="cli">${esc(c.name)}</div>
      <div class="sub">${esc(c.subtitle)}<br>${esc(c.team)}<br>Atualizado em ${br(c.updatedAt)}</div>
    </div>
    <div class="box"><h3>POSIÇÃO EM RELAÇÃO À NOSSA SOLUÇÃO</h3>
      <div class="pos3">${Object.values(POST).map(s => `<div class="posc" style="border-color:${s.c}${s===POST.nm?';border-style:dashed':''}"><b style="color:${s.c}"><span class="dot" style="background:${s.c}"></span>${s.l.toUpperCase()}</b><small>${s.d}</small></div>`).join('')}</div>
    </div>
    <div class="box"><h3>OS 6 PAPÉIS</h3>
      <div class="roles">${Object.entries(PAPEIS).map(([k,r]) => `<div>${badge(k)}${r.l}: ${r.d}</div>`).join('')}</div>
    </div>
  </div>
  <div class="org">
    <div class="topw">${card(c.top)}</div>
    <div class="vl" style="height:24px"></div>
    <div class="cols" style="grid-template-columns:repeat(${n},minmax(0,1fr))">
      ${n > 1 ? `<div class="hbar" style="left:calc((100% - ${(n-1)*gap}px)/${2*n});right:calc((100% - ${(n-1)*gap}px)/${2*n})"></div>` : ''}
      ${c.areas.map(areaCol).join('')}
    </div>
    <button type="button" class="adda edit-only" id="addArea">+ Adicionar área</button>
  </div>
  <div class="sum">
    <div><h3>TERMÔMETRO DA CONTA</h3>
      <div class="kp">
        <div><b style="color:${POST.fav.c}">${cnt('fav')}</b><small>Favoráveis</small></div>
        <div><b style="color:${POST.neu.c}">${cnt('neu')}</b><small>Neutras</small></div>
        <div><b style="color:${POST.det.c}">${cnt('det')}</b><small>Detratoras</small></div>
        <div><b style="color:${POST.nm.c}">${cnt('nm')}</b><small>A mapear</small></div>
        <div><b>${strong}</b><small>Relações fortes</small></div>
        <div><b>${mapped.length}/${ppl.length}</b><small>Posições mapeadas</small></div>
      </div></div>
    <div><h3>COBERTURA DOS PAPÉIS-CHAVE</h3><div class="cov">${cov}</div></div>
  </div>
  <div class="foot">
    <div><b style="color:var(--tx2)">COMO USAR ESTE MAPA</b><p>Comece pelos favoráveis, avance sobre os neutros e mapeie as objeções dos detratores antes de pedir uma decisão.</p></div>
    <div><b style="color:${POST.fav.c}">ENGAJE OS FAVORÁVEIS</b><p>Peça apoio interno, construa o caso de sucesso junto e use essas pessoas para abrir portas.</p></div>
    <div><b style="color:${POST.neu.c}">CONVERTA OS NEUTROS</b><p>Mostre valor ligado à dor de cada um e conecte a solução ao problema que vivem no dia a dia.</p></div>
    <div><b style="color:${POST.det.c}">GERENCIE OS DETRATORES</b><p>Entenda a objeção real, trate o risco com evidência e reduza o impacto negativo na decisão.</p></div>
  </div>`;
}

function renderTabs(){
  $('tabs').innerHTML = state.clients.map(c => `<button type="button" class="tab" role="tab" aria-selected="${c.id === curId}" data-tab="${esc(c.id)}">${esc(c.name)}</button>`).join('')
    + '<button type="button" class="tab add" id="addCli">+ Novo cliente</button>';
}
function renderLog(){
  const c = cur();
  $('log').innerHTML = `<h2>Histórico de mudanças · ${esc(c.name)}</h2><ul>${(c.log || []).slice(0,40).map(l => `<li><span>${br(l.d)}</span>${esc(l.t)}</li>`).join('') || '<li>Sem registros.</li>'}</ul>`;
}
function render(){ renderTabs(); renderBoard(); renderLog(); $('board').classList.toggle('hide-notes', !$('notesChk').checked); }

function find(pid){
  const c = cur();
  if (c.top.id === pid) return {p: c.top, area: null};
  for (const a of c.areas) { const p = a.people.find(x => x.id === pid); if (p) return {p, area: a}; }
  return null;
}
const opts = (obj, sel, lab) => Object.entries(obj).map(([k,v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${lab ? lab(k,v) : esc(v)}</option>`).join('');

function openPerson(pid, isNew){
  const c = cur(), f = find(pid); if (!f) return;
  const {p, area} = f, isTop = !area;
  $('md').innerHTML = `
    <h2>${isNew ? 'Nova pessoa' : 'Editar pessoa'}</h2>
    <div class="ph"><span class="av" id="mAv">${p.foto ? `<img src="${esc(p.foto)}" alt="">` : esc(initials(p.name))}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="mPh">${p.foto ? 'Trocar foto' : 'Incluir foto'}</button>${p.foto ? '<button class="btn dng" id="mPhDel">Remover foto</button>' : ''}</div></div>
    <div class="fg"><label for="fName">Nome</label><input id="fName" value="${esc(p.name)}"></div>
    <div class="fg"><label for="fCargo">Cargo</label><input id="fCargo" value="${esc(p.cargo)}"></div>
    <div class="fg"><label for="fLi">LinkedIn</label><input id="fLi" type="url" value="${esc(p.linkedin || '')}" placeholder="https://www.linkedin.com/in/..."></div>
    <div class="row2">
      <div class="fg"><label for="fPapel">Papel</label><select id="fPapel">${opts(PAPEIS, p.papel, (k,v) => `${k} · ${v.l}`)}</select></div>
      <div class="fg"><label for="fPost">Posição</label><select id="fPost">${opts(POST, p.postura, (k,v) => v.l)}</select></div>
    </div>
    <div class="row2">
      <div class="fg"><label for="fRel">Força da relação</label><select id="fRel">${opts(REL, p.relacao)}</select></div>
      ${isTop ? '<div></div>' : `<div class="fg"><label for="fArea">Área</label><select id="fArea">${c.areas.map(a => `<option value="${esc(a.id)}" ${a === area ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>`}
    </div>
    <div class="fg"><label for="fNota">Nota (contexto, próximo passo)</label><textarea id="fNota">${esc(p.nota)}</textarea></div>
    <div class="mdacts">
      <div>${isTop ? '' : '<button class="btn" id="mUp">↑ Subir</button><button class="btn" id="mDown">↓ Descer</button><button class="btn dng" id="mDel">Excluir</button>'}</div>
      <div><button class="btn" id="mCancel">Cancelar</button><button class="btn pri" id="mSave">Salvar</button></div>
    </div>`;
  $('ov').classList.add('on'); $('fName').focus();
  const close = () => { $('ov').classList.remove('on'); };
  let pendingFoto = p.foto || '';
  const showAv = () => { $('mAv').innerHTML = pendingFoto ? `<img src="${esc(pendingFoto)}" alt="">` : esc(initials($('fName').value || p.name)); };
  $('mPh').onclick = () => pickPhoto(url => { pendingFoto = url; showAv(); });
  if ($('mPhDel')) $('mPhDel').onclick = () => { pendingFoto = ''; showAv(); $('mPhDel').remove(); };
  $('mCancel').onclick = () => { if (isNew) { area.people = area.people.filter(x => x !== p); render(); } close(); };
  $('mSave').onclick = () => {
    let li = $('fLi').value.trim();
    if (li && !/^https?:\/\//i.test(li)) li = 'https://' + li.replace(/^\/+/, '');
    if (li && !/^https?:\/\/([a-z0-9-]+\.)*linkedin\.com\//i.test(li)) { toast('Use um link do LinkedIn (linkedin.com/in/...).'); $('fLi').focus(); return; }
    const nv = {linkedin: li, name: $('fName').value.trim() || '[A mapear]', cargo: $('fCargo').value.trim(), papel: $('fPapel').value, postura: $('fPost').value, relacao: $('fRel').value, nota: $('fNota').value.trim()};
    const ch = [];
    if (!isNew) {
      if (nv.name !== p.name) ch.push(`nome: ${p.name} → ${nv.name}`);
      if (nv.cargo !== p.cargo) ch.push(`cargo: ${p.cargo || '—'} → ${nv.cargo || '—'}`);
      if (nv.papel !== p.papel) ch.push(`papel: ${p.papel} → ${nv.papel}`);
      if (nv.postura !== p.postura) ch.push(`posição: ${POST[p.postura].l} → ${POST[nv.postura].l}`);
      if (nv.relacao !== p.relacao) ch.push(`relação: ${REL[p.relacao]} → ${REL[nv.relacao]}`);
      if (nv.nota !== p.nota) ch.push('nota atualizada');
      if (nv.linkedin !== (p.linkedin || '')) ch.push(nv.linkedin ? 'LinkedIn atualizado' : 'LinkedIn removido');
      if (pendingFoto !== (p.foto || '')) ch.push(pendingFoto ? 'foto atualizada' : 'foto removida');
    }
    Object.assign(p, nv);
    if (pendingFoto) p.foto = pendingFoto; else delete p.foto;
    if (!isTop) {
      const to = c.areas.find(a => a.id === $('fArea').value);
      if (to && to !== area) { area.people = area.people.filter(x => x !== p); to.people.push(p); ch.push(`movida de ${area.name} para ${to.name}`); }
    }
    close();
    if (isNew) touch(c, `Adicionada: ${p.name} (${p.cargo || 'sem cargo'}) · ${POST[p.postura].l}`);
    else if (ch.length) touch(c, `${p.name}: ${ch.join('; ')}`);
    else render();
  };
  if (!isTop) {
    const mv = d => { const i = area.people.indexOf(p), j = i + d; if (j < 0 || j >= area.people.length) return; [area.people[i], area.people[j]] = [area.people[j], area.people[i]]; persist(); render(); };
    $('mUp').onclick = () => mv(-1);
    $('mDown').onclick = () => mv(1);
    $('mDel').onclick = () => { if (!confirm(`Excluir ${p.name}?`)) return; area.people = area.people.filter(x => x !== p); close(); touch(c, `Removida: ${p.name} (${p.cargo || 'sem cargo'})`); };
  }
}

function openArea(aid, isNew){
  const c = cur(), a = c.areas.find(x => x.id === aid); if (!a) return;
  $('md').innerHTML = `
    <h2>${isNew ? 'Nova área' : 'Editar área'}</h2>
    <div class="fg"><label for="aName">Nome da área</label><input id="aName" value="${esc(a.name)}"></div>
    <div class="row2">
      <div class="fg"><label for="aPapel">Papel da área</label><select id="aPapel">${opts(PAPEIS, a.papel, (k,v) => `${k} · ${v.l}`)}</select></div>
      <div class="fg"><label for="aDesc">Descrição curta</label><input id="aDesc" value="${esc(a.desc)}"></div>
    </div>
    <div class="mdacts">
      <div><button class="btn" id="aL">← Esquerda</button><button class="btn" id="aR">Direita →</button><button class="btn dng" id="aDel">Excluir área</button></div>
      <div><button class="btn" id="aCancel">Cancelar</button><button class="btn pri" id="aSave">Salvar</button></div>
    </div>`;
  $('ov').classList.add('on'); $('aName').focus();
  const close = () => $('ov').classList.remove('on');
  $('aCancel').onclick = () => { if (isNew) { c.areas = c.areas.filter(x => x !== a); render(); } close(); };
  $('aSave').onclick = () => {
    const old = a.name; a.name = $('aName').value.trim() || 'Área'; a.papel = $('aPapel').value; a.desc = $('aDesc').value.trim(); close();
    touch(c, isNew ? `Área criada: ${a.name}` : (old !== a.name ? `Área renomeada: ${old} → ${a.name}` : `Área atualizada: ${a.name}`));
  };
  const mv = d => { const i = c.areas.indexOf(a), j = i + d; if (j < 0 || j >= c.areas.length) return; [c.areas[i], c.areas[j]] = [c.areas[j], c.areas[i]]; persist(); render(); };
  $('aL').onclick = () => mv(-1); $('aR').onclick = () => mv(1);
  $('aDel').onclick = () => { if (!confirm(`Excluir a área ${a.name} e ${a.people.length} pessoa(s)?`)) return; c.areas = c.areas.filter(x => x !== a); close(); touch(c, `Área removida: ${a.name}`); };
}

$('ov').addEventListener('click', e => { if (e.target === $('ov')) $('ov').classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('ov').classList.contains('on')) { const b = $('mCancel') || $('aCancel'); b ? b.click() : $('ov').classList.remove('on'); } });

$('tabs').addEventListener('click', e => { if (e.target.closest('#addCli')) return newClient(); const b = e.target.closest('[data-tab]'); if (!b) return; curId = b.dataset.tab; try { localStorage.setItem(KEY + '-tab', curId); } catch (x) {} render(); });
function pickPhoto(cb){
  const inp = $('photoFile');
  inp.onchange = () => {
    const f = inp.files[0]; inp.value = ''; if (!f) return;
    const img = new Image(), u = URL.createObjectURL(f);
    img.onload = () => {
      const S = 160, s = Math.min(img.width, img.height), cv = document.createElement('canvas');
      cv.width = cv.height = S;
      cv.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, S, S);
      URL.revokeObjectURL(u); cb(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(u); toast('Não foi possível ler esta imagem.'); };
    img.src = u;
  };
  inp.click();
}

function openClient(isNew){
  const c = cur();
  $('md').innerHTML = `
    <h2>${isNew ? 'Novo cliente' : 'Editar cliente'}</h2>
    <div class="fg"><label for="cName">Nome do cliente (aba)</label><input id="cName" value="${esc(c.name)}"></div>
    <div class="fg"><label for="cSub">Descrição (segmento, contexto)</label><input id="cSub" value="${esc(c.subtitle)}"></div>
    <div class="fg"><label for="cTeam">Time responsável</label><input id="cTeam" value="${esc(c.team)}" placeholder="Ex.: Blip: Nome (CSM) · Nome (KAM)"></div>
    <div class="mdacts">
      <div><button class="btn" id="cL">← Aba</button><button class="btn" id="cR">Aba →</button><button class="btn dng" id="cDel">Excluir cliente</button></div>
      <div><button class="btn" id="cCancel">Cancelar</button><button class="btn pri" id="cSave">Salvar</button></div>
    </div>`;
  $('ov').classList.add('on'); $('cName').focus(); $('cName').select();
  const close = () => $('ov').classList.remove('on');
  $('cCancel').onclick = () => { if (isNew) { state.clients = state.clients.filter(x => x !== c); curId = state.clients[0].id; render(); } close(); };
  $('cSave').onclick = () => {
    const old = c.name; c.name = $('cName').value.trim() || 'Cliente'; c.subtitle = $('cSub').value.trim(); c.team = $('cTeam').value.trim(); close();
    touch(c, isNew ? `Cliente criado: ${c.name}` : (old !== c.name ? `Cliente renomeado: ${old} → ${c.name}` : 'Dados do cliente atualizados'));
  };
  const mv = d => { const i = state.clients.indexOf(c), j = i + d; if (j < 0 || j >= state.clients.length) return; [state.clients[i], state.clients[j]] = [state.clients[j], state.clients[i]]; persist(); render(); };
  $('cL').onclick = () => mv(-1); $('cR').onclick = () => mv(1);
  $('cDel').onclick = () => {
    if (state.clients.length === 1) return toast('Mantenha pelo menos um cliente.');
    if (!confirm(`Excluir o power map de ${c.name}? Esta ação não pode ser desfeita.`)) return;
    state.clients = state.clients.filter(x => x !== c); curId = state.clients[0].id; close(); persist(); render(); toast(`${c.name} removido.`);
  };
}
function newClient(){
  const pp = (papel, cargo) => ({id: uid(), name: '[A mapear]', cargo, papel, postura: 'nm', relacao: 'nm', nota: ''});
  const c = {id: uid(), name: 'Novo cliente', subtitle: '', team: '', updatedAt: today(),
    top: pp('PS', 'Executivo que assina o contrato'),
    areas: [
      {id: uid(), name: 'Negócios', papel: 'BDM', desc: 'Área de negócios', people: [pp('BDM', 'Decisor de negócio')]},
      {id: uid(), name: 'Tecnologia', papel: 'TDM', desc: 'Tecnologia', people: [pp('TDM', 'Decisor técnico')]},
      {id: uid(), name: 'Executivo', papel: 'ES', desc: 'Patrocínio executivo', people: [pp('ES', 'Sponsor executivo')]},
      {id: uid(), name: 'Operação', papel: 'I', desc: 'Usuários e influenciadores', people: [pp('I', 'Usuário-chave')]}],
    log: [{d: today(), t: 'Power map criado.'}]};
  state.clients.push(c); curId = c.id; render(); openClient(true);
}
$('cliBtn').onclick = () => openClient(false);

$('board').addEventListener('click', e => {
  const li = e.target.closest('[data-li]');
  if (li) { e.stopPropagation(); const u = li.dataset.li; if (/^https?:\/\//i.test(u)) window.open(u, '_blank', 'noopener'); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) { e.stopPropagation(); const f = find(ph.dataset.photo); if (!f) return; return pickPhoto(url => { f.p.foto = url; touch(cur(), `${f.p.name}: foto atualizada`); }); }
  if (e.target.closest('[data-client]')) return openClient(false);
  const pc = e.target.closest('[data-pid]'); if (pc) return openPerson(pc.dataset.pid);
  const ar = e.target.closest('[data-area]'); if (ar) return openArea(ar.dataset.area);
  const ad = e.target.closest('[data-add]'); if (ad) { const a = cur().areas.find(x => x.id === ad.dataset.add); const p = {id: uid(), name: '', cargo: '', papel: a.papel, postura: 'nm', relacao: 'nm', nota: ''}; a.people.push(p); render(); return openPerson(p.id, true); }
  if (e.target.closest('#addArea')) { const a = {id: uid(), name: 'Nova área', papel: 'I', desc: '', people: []}; cur().areas.push(a); render(); openArea(a.id, true); }
});
$('notesChk').addEventListener('change', render);

function download(blob, name){ const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');

async function snapshot(){
  if (typeof html2canvas === 'undefined') { toast('Sem conexão para carregar o gerador de imagem. Conecte-se à internet e recarregue.'); return null; }
  const b = $('board'); document.body.classList.add('exporting');
  try {
    await document.fonts.ready;
    return await html2canvas(b, {backgroundColor: '#12121a', scale: 2, useCORS: true, width: b.scrollWidth, height: b.scrollHeight, windowWidth: b.scrollWidth + 80});
  } finally { document.body.classList.remove('exporting'); }
}
$('pngBtn').onclick = async () => {
  const cv = await snapshot(); if (!cv) return;
  cv.toBlob(bl => { download(bl, `PowerMap_${slug(cur().name)}_${today()}.png`); toast('PNG baixado. Anexe na nota fixada do HubSpot.'); }, 'image/png');
};
$('copyBtn').onclick = async () => {
  const cv = await snapshot(); if (!cv) return;
  cv.toBlob(async bl => {
    try { await navigator.clipboard.write([new ClipboardItem({'image/png': bl})]); toast('Imagem copiada. Cole direto na nota do HubSpot (Ctrl+V).'); }
    catch (e) { download(bl, `PowerMap_${slug(cur().name)}_${today()}.png`); toast('Seu navegador bloqueou a cópia; o PNG foi baixado.'); }
  }, 'image/png');
};
$('htmlBtn').onclick = () => {
  persist();
  const json = JSON.stringify(state, null, 1).replace(/</g, '\\u003c');
  const html = TEMPLATE.replace(/(<script id="pm-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + '\n' + json + '\n' + b);
  download(new Blob([html], {type: 'text/html'}), `PowerMap_Carteira_${today()}.html`);
  toast('Nova versão do HTML baixada. Substitua o arquivo anterior.');
};
$('jsonBtn').onclick = () => { persist(); download(new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'}), `PowerMap_dados_${today()}.json`); };
$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (!d.clients || !Array.isArray(d.clients) || !d.clients.length) throw new Error();
    state = d; curId = d.clients[0].id; persist(); render(); toast('Dados importados.');
  }).catch(() => toast('Arquivo inválido.'));
  e.target.value = '';
};

render();
</script></body></html>
